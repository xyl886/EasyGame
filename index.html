<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="EasyGame · 八款经典益智小游戏（另含三国华容道），即开即玩、离线可用。"
    />
    <!-- 分享卡片预览（og 图片指向 GitHub Pages 部署域名，换部署平台时需同步修改） -->
    <meta property="og:title" content="EasyGame · 益智小游戏集合" />
    <meta
      property="og:description"
      content="八款经典益智小游戏，另含三国华容道经典滑块，即开即玩、离线可用！"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://xyl886.github.io/EasyGame/pwa-512x512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EasyGame" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EasyGame · 益智小游戏集合</title>
    <script>
      // 首帧前同步主题，避免深色模式闪白（FOUC）。
      // 注意：StorageAdapter 用 JSON.stringify 存值，raw 形如 "\"dark\""。
      ;(function () {
        try {
          var raw = localStorage.getItem('easygame-theme')
          var saved = raw ? JSON.parse(raw) : null
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式等场景下静默降级 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
